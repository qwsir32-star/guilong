name: 功能建议
description: 告诉我们你希望归拢解决什么问题
title: "[建议] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么问题？
      description: 请描述实际使用场景，以及目前怎么处理。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望怎样改进？
      description: 可以附上示例或草图。
    validations:
      required: true
