<body data-page-node-id="MPDVj6Kz1F5GxUbqbgwboN">

  <!-- ================================================================

      <h1 id="greeting" data-page-node-id="6BfW56Qw8wT4W39thfSbe1"></h1>
      <!-- "Friday, April 4, 2026" — written by getDateDisplay() in app.js -->

    </div>

    <!-- ================================================================
         搜索框 —— 和问候语同一行，省掉一整条纵向空间。
         输入网址就直接打开，否则交给默认搜索引擎。
         ================================================================ -->
    <div class="search-bar" id="searchBar">
      <form class="search-form" id="searchForm">
        <span class="search-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">

               data-i18n-placeholder="search.placeholder" autocomplete="off" spellcheck="false">
      </form>
    </div>

    <!-- 设置入口特意放在页头：站点条被关掉之后，这里仍然能把设置叫回来。

      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />

      <span data-i18n="settings.button"></span>
    </button>
  </header>

  <!-- ================================================================
       设置面板 —— 点页头的齿轮才展开
       每一项只控制「显示不显示」。关掉不会删任何数据：已经钉住的站点、
       隐藏名单都原样留在 storage 里，重新打开就回来了。
       ================================================================ -->
  <div class="settings-panel" id="settingsPanel">
    <p class="settings-title" data-i18n="settings.title"></p>

    <label class="setting-row">
      <span class="setting-text">
        <span class="setting-name" data-i18n="settings.quickSites.name"></span>
        <span class="setting-desc" data-i18n="settings.quickSites.desc"></span>
      </span>
      <input type="checkbox" class="setting-switch" data-setting="showQuickSites">
    </label>

    <label class="setting-row">
      <span class="setting-text">
        <span class="setting-name" data-i18n="settings.searchBox.name"></span>
        <span class="setting-desc" data-i18n="settings.searchBox.desc"></span>
      </span>
      <input type="checkbox" class="setting-switch" data-setting="showSearchBox">
    </label>
  </div>

  <!-- ================================================================
       常用站点条 — 手动钉住的在前，chrome.topSites 自动补足
       新标签页被 Tab Out 接管后，原来放首页的那排快捷入口会没掉，
       这一条就是把它找回来。
       ================================================================ -->
  <div class="quick-sites" id="quickSites" data-page-node-id="D63K5snOoyxWSEIH36Zpa7">
    <div class="quick-sites-list" id="quickSitesList" data-page-node-id="KbKCeTyP3VP61HfhVrXHdj"></div>

    <!-- 手动钉住 / 编辑已有入口，共用这一张表单 -->
    <div class="quick-site-form" id="quickSiteForm" style="display:none" data-page-node-id="A6uH9fclm1IEfIhJaD0nkC">
      <p class="pin-title" id="pinFormTitle" data-page-node-id="QCZQZ9Ny8VAi000ACDFIaN" data-i18n="pin.formTitleNew"></p>
      <div class="pin-field" data-page-node-id="X6TExP4JQOFmDSwY0nshkq">
        <label for="quickSiteInput" data-page-node-id="J9eM7kTHI7NwX41mFF5MtC" data-i18n="pin.labelUrl"></label>

      </div>
      <div class="pin-field" data-page-node-id="6Dl2akVhOCUROStAmd8qZ3">
        <label for="pinNameInput" data-page-node-id="U70VS5dz6VzqJcbQKZ2KOl" data-i18n="pin.labelName"></label>
        <input type="text" id="pinNameInput" data-i18n-placeholder="pin.namePlaceholder" autocomplete="off" data-page-node-id="OaW1YUFAEIldgredj2yJ9L">
      </div>
      <div class="pin-field" data-page-node-id="ZElAAsw8DyxqPhGhqmkBvr">
        <label for="pinIconInput" data-page-node-id="bgFMBdz34QtdwCK5BGPbMg" data-i18n="pin.labelIcon"></label>
        <input type="text" id="pinIconInput" data-i18n-placeholder="pin.iconPlaceholder"
               autocomplete="off" spellcheck="false" data-page-node-id="THHJlarxYxAkKP74CDkQ1s">

      </div>
    </div>
  </div>

  <!-- ================================================================
       MAIN CONTENT AREA — two-column layout
       Left: open tabs (domain/mission cards)
       Right: saved for later checklist
       The right column only renders when it has items (JS controls this)
       ================================================================ -->
  <div class="dashboard-columns" id="dashboardColumns" data-page-node-id="ptwaNfyJ8aY26NSB13nHfp">

    <!-- LEFT COLUMN: Open tabs -->
    <div class="active-section" id="openTabsSection" style="display:none" data-page-node-id="o92hcFa2cxMPnsvJh79BD9">
      <div class="section-header" data-page-node-id="aPH8Rc3in16BsvRdphieiB">
        <h2 id="openTabsSectionTitle" data-page-node-id="mnh8WZsnqSg2EgaBSRp9U6" data-i18n="section.openTabs"></h2>
        <div class="section-line" data-page-node-id="uaBdBjOI5Ao8fA2WGFGELE"></div>
        <div class="section-count" id="openTabsSectionCount" data-page-node-id="fRncLhJfe3JAm29HgokY4K"></div>
      </div>
      <!-- 批量操作：全部存入 Saved for later / 存入并关闭 / 关闭全部 — 由 JS 填充 -->
      <div class="section-actions" id="openTabsActions" style="display:none" data-page-node-id="kZurjHhfp4PWGs94dTFTtq"></div>
      <div class="missions" id="openTabsMissions" data-page-node-id="DrTIqEjeZxBAUbd02gqaxl"></div>
    </div>

    <!-- RIGHT COLUMN: Saved for Later checklist -->

        <div class="section-count" id="deferredCount" data-page-node-id="0ntPxErINLAvFvHDqo9JgT"></div>
      </div>

      <!-- 批量操作：一键打开全部未打勾的条目 — 由 renderDeferredColumn() 填充 -->
      <div class="deferred-actions" id="deferredActions" style="display:none" data-page-node-id="fgRFA38SVyy3CeAIYgrmYo"></div>

      <!-- Active checklist items — injected by renderDeferredList() in app.js -->
      <div class="deferred-list" id="deferredList" data-page-node-id="0MsaAGG3bN2x3VUMAECAk0"></div>

      <!-- Empty state — shown when no active deferred tabs -->
      <div class="deferred-empty" id="deferredEmpty" style="display:none" data-i18n="deferred.empty" data-page-node-id="RuVJsPhVVqDifcUTO6bHlb">
      </div>

      <!-- Archive section — collapsed by default -->
      <div class="deferred-archive" id="deferredArchive" style="display:none" data-page-node-id="dydVsw9dyd0TpFPXHChtWX">
        <button class="archive-toggle" id="archiveToggle" data-page-node-id="cyRBRkDHLK59hhMl5GDDVJ">

          <span data-i18n="archive.toggle"></span>
          <span class="archive-count" id="archiveCount" data-page-node-id="0s3BOc23acmxz3B6GA3RvG"></span>
        </button>
        <div class="archive-body" id="archiveBody" style="display:none" data-page-node-id="LPud6DDNYecF9sKPvR02Cx">
          <input type="text" class="archive-search" id="archiveSearch" data-i18n-placeholder="archive.searchPlaceholder" data-page-node-id="wrqYJJve5irYnoikIjhtNp">
          <div class="archive-list" id="archiveList" data-page-node-id="2Bz9B5YEOZ6yWqaWANJ0Oy"></div>
        </div>
      </div>
    </div>

  </div><!-- end .dashboard-columns -->

  <!-- ================================================================

</div><!-- end .container -->

<!-- Personal config (gitignored) — defines LOCAL_LANDING_PAGE_PATTERNS etc. -->
<!-- If the file doesn't exist, that's fine — app.js uses sensible defaults,
     and a missing file only logs a harmless 404 in the console.
     NOTE: do NOT add onerror="..." here — MV3's default CSP (script-src 'self')
     blocks inline event handlers, so it would never run and would log
     "Refused to execute inline event handler" on every new tab. -->
<script src="config.local.js"></script>

<!-- 文案表 —— 必须在 app.js 之前。所有给人看的字都在这里，
     静态文案靠 data-i18n 在启动时填充（见 applyStaticStrings）。 -->
<script src="strings.js"></script>

<!-- Main dashboard logic — loads last so the DOM is ready -->
<script src="app.js"></script>
